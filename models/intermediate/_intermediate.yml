version: 2

models:
  - name: int_supplier_golden_record
    description: One row per real supplier (VAT). Duplicates in SAP are merged into the oldest ID.
    columns:
      - name: vat_number
        data_tests: [unique, not_null]
      - name: golden_supplier_id
        data_tests: [unique, not_null]

  - name: int_supplier_sap_to_golden
    description: Every SAP supplier ID mapped to its golden ID.
    columns:
      - name: sap_supplier_id
        data_tests: [unique, not_null]

  - name: int_supplier_mapping
    description: Ariba supplier ID -> golden SAP supplier, matched by VAT. Unmatched kept.
    columns:
      - name: ariba_supplier_id
        data_tests: [unique, not_null]
      - name: is_matched
        description: 4 planted contract suppliers do not exist in SAP.

  - name: int_fx_monthly
    description: Monthly rates per currency incl. EUR = 1.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["rate_month", "from_currency"]

  - name: int_category_hierarchy
    description: Category tree flattened with a recursive CTE (path, level 1 and level 2 parents).
    columns:
      - name: category_id
        data_tests: [unique, not_null]

  - name: int_category_mapping
    columns:
      - name: material_group
        data_tests: [unique, not_null]

  - name: int_po_items_enriched
    description: PO lines with golden supplier, category, EUR value and compliance flags.
    columns:
      - name: po_item_key
        data_tests: [unique, not_null]

  - name: int_invoice_lines_enriched
    description: Invoice lines with PO link, EUR amount and price variance.
    columns:
      - name: invoice_item_key
        data_tests: [unique, not_null]
